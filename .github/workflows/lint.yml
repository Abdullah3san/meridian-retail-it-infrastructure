name: Lint configs & docs

# Validates every config sample and doc in this repo on push/PR so a bad
# edit (invalid Compose syntax, malformed JSON, a broken relative link)
# gets caught before it lands on main, not discovered by a reader.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-docker-compose:
    name: Validate Docker Compose stacks
    runs-on: ubuntu-latest
    # These sample stacks reference .env vars documented inline but not
    # committed (see .gitignore) — supply throwaway values so
    # `compose config` can fully resolve and validate the syntax.
    env:
      ZABBIX_DB_PASSWORD: dummy-ci-value
      GRAFANA_ADMIN_PASSWORD: dummy-ci-value
      DB_ROOT_PASSWORD: dummy-ci-value
      DB_PASSWORD: dummy-ci-value
      NC_ADMIN_USER: dummy-ci-value
      NC_ADMIN_PASSWORD: dummy-ci-value
      VW_ADMIN_TOKEN: dummy-ci-value
      SMTP_USER: dummy-ci-value
      SMTP_PASSWORD: dummy-ci-value
      WAZUH_INDEXER_PASSWORD: dummy-ci-value
      WAZUH_DASHBOARD_PASSWORD: dummy-ci-value
      WAZUH_API_PASSWORD: dummy-ci-value
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config (syntax check) for each stack
        run: |
          set -e
          for f in configs/docker-compose/*.yml; do
            echo "== $f =="
            docker compose -f "$f" config -q
          done
      - name: Wazuh override still merges onto the pinned upstream release
        run: |
          set -e
          # Same version Ansible deploys — one source of truth.
          v=$(sed -n 's/^wazuh_version: "\([^"]*\)".*/\1/p' iac/ansible/inventory/group_vars/all/main.yml)
          mkdir -p /tmp/wazuh && cd /tmp/wazuh
          curl -fsSL -o docker-compose.yml "https://raw.githubusercontent.com/wazuh/wazuh-docker/v$v/single-node/docker-compose.yml"
          cp "$GITHUB_WORKSPACE/configs/docker-compose/wazuh/docker-compose.override.yml" .
          docker compose config -q
          echo "override merges cleanly onto wazuh-docker v$v"

  validate-terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iac/terraform
    env:
      TF_VAR_proxmox_api_token: dummy-ci-value
      TF_VAR_ansible_ssh_public_key: ssh-ed25519 dummy-ci-value
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: Committed Ansible inventory matches what Terraform would generate
        run: |
          echo 'templatefile("templates/inventory.yml.tftpl", { vms = local.vms, domain = var.domain, groups = sort(distinct(flatten([for vm in values(local.vms) : vm.groups]))) })' \
            | terraform console > /tmp/rendered.txt
          # console wraps the string in <<EOT ... EOT; strip that and trailing blank lines
          sed '1d;$d' /tmp/rendered.txt | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > /tmp/hosts.yml
          diff -u ../ansible/inventory/hosts.yml /tmp/hosts.yml

  lint-ansible:
    name: Lint Ansible
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iac/ansible
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ansible-core ansible-lint
      - run: ansible-galaxy collection install -r requirements.yml
      - run: ansible-playbook site.yml --syntax-check
      - run: ansible-lint

  validate-json:
    name: Validate JSON configs (Kea DHCP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check well-formed JSON
        run: |
          set -e
          # Kea's config is JSON even though the sample keeps a .conf.sample
          # extension (matching how pfSense/Kea ship it) — validate directly.
          files="configs/dhcp/kea-dhcp4.conf.sample"
          for f in $(find configs -name '*.json' 2>/dev/null) $files; do
            echo "== $f =="
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done

  lint-markdown-links:
    name: Check for broken relative links in docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint relative markdown links
        # Maintained successor of the archived gaurav-nelson action; same config format.
        uses: tcort/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/workflows/markdown-link-check-config.json'

  validate-mermaid:
    name: Validate Mermaid diagram syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract and validate each mermaid block
        run: |
          set -e
          npm install -g @mermaid-js/mermaid-cli@11
          # Ubuntu 24.04 runners block the unprivileged user namespaces
          # Chrome's sandbox needs, so headless Chrome must run without it.
          echo '{"args":["--no-sandbox","--disable-setuid-sandbox"]}' > /tmp/puppeteer.json
          mkdir -p /tmp/mmd
          for f in $(grep -rl '```mermaid' --include='*.md' diagrams docs); do
            # Name each block after its source file so blocks don't overwrite each other.
            awk -v p="/tmp/mmd/$(basename "$f" .md)" \
              '/```mermaid/{flag=1; n++; file=p "-" n ".mmd"; next} /```/{flag=0} flag{print > file}' "$f"
          done
          fail=0
          for mmd in /tmp/mmd/*.mmd; do
            echo "== $mmd =="
            mmdc -p /tmp/puppeteer.json -i "$mmd" -o "${mmd}.svg" || fail=1
          done
          exit $fail
