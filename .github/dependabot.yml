# Keeps the pinned versions in this repo from going stale: opens a PR when a
# newer image tag or action release is out, so CI validates the bump before
# it lands on main.
version: 2
updates:
  - package-ecosystem: docker-compose
    directory: /configs/docker-compose
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]
        update-types: [minor, patch]
    # Other major bumps still arrive as their own PR, since they can need
    # migration steps and a doc update. Some are ignored on purpose because
    # the design tracks long-term-support lines, bumped by hand when that
    # line moves: Nextcloud's "production" channel, MariaDB LTS, and Zabbix
    # 7.0 LTS (patch updates only, so it never drifts to 7.2/7.4 standard).
    ignore:
      - dependency-name: nextcloud
        update-types: [version-update:semver-major]
      - dependency-name: mariadb
        update-types: [version-update:semver-major]
      - dependency-name: "zabbix/*"
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directory: /iac/terraform
    schedule:
      interval: weekly
