# Monitoring stack — Zabbix + Grafana, deployed inside mon01
# Design context: docs/06-monitoring-observability.md
#
# Usage: place on mon01, set a real .env with the passwords below, then:
#   docker compose up -d
#
# This is a runnable reference — review resource limits/volumes for your
# actual hardware before using in production.

version: "3.8"

services:
  zabbix-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
      POSTGRES_DB: zabbix
    volumes:
      - zabbix-db-data:/var/lib/postgresql/data
    networks: [monitoring]

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:6.4-alpine
    restart: unless-stopped
    depends_on: [zabbix-db]
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
      POSTGRES_DB: zabbix
    ports:
      - "10051:10051"   # Zabbix agent -> server (all monitored hosts connect here)
    volumes:
      - zabbix-server-data:/var/lib/zabbix
    networks: [monitoring]

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:6.4-alpine
    restart: unless-stopped
    depends_on: [zabbix-server, zabbix-db]
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
      POSTGRES_DB: zabbix
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: Etc/UTC
    ports:
      - "127.0.0.1:8080:8080"   # Fronted by the DMZ reverse proxy, not exposed directly — docs/05
    networks: [monitoring]

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    depends_on: [zabbix-web]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: alexanderzobnin-zabbix-app   # Zabbix datasource plugin
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
    ports:
      - "127.0.0.1:3000:3000"   # Fronted by the DMZ reverse proxy, not exposed directly
    volumes:
      - grafana-data:/var/lib/grafana
    networks: [monitoring]

networks:
  monitoring:
    driver: bridge

volumes:
  zabbix-db-data:
  zabbix-server-data:
  grafana-data:

# .env (create alongside this file, DO NOT commit real values to git):
#   ZABBIX_DB_PASSWORD=change-me
#   GRAFANA_ADMIN_PASSWORD=change-me
