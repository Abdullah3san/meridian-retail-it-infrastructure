# Nextcloud stack — files01
# Design context: docs/04-software-stack.md (Nextcloud section)
#
# LDAP integration against dc01 (Samba AD) is configured post-deploy via
# the "LDAP/AD integration" app in Nextcloud's admin settings, pointed at
# dc01.meridianretail.local:389 — see docs/03-identity-and-access.md.

version: "3.8"

services:
  nextcloud-db:
    image: mariadb:11
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - nc-db-data:/var/lib/mysql
    networks: [nextcloud]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [nextcloud]

  nextcloud:
    image: nextcloud:29-apache
    restart: unless-stopped
    depends_on: [nextcloud-db, redis]
    environment:
      MYSQL_HOST: nextcloud-db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${DB_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NC_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: files.meridianretail.local
      REDIS_HOST: redis
    ports:
      - "127.0.0.1:8081:80"   # Fronted by internal reverse proxy — reachable via SSO (docs/03), never public
    volumes:
      - nc-app-data:/var/www/html
      - nc-user-data:/var/www/html/data   # Departmental data lives here — backed up nightly, docs/07
    networks: [nextcloud]

networks:
  nextcloud:
    driver: bridge

volumes:
  nc-db-data:
  nc-app-data:
  nc-user-data:

