<!--
  Meridian additions to the Wazuh manager config (ossec.conf).
  Appended to upstream's config/wazuh_cluster/wazuh_manager.conf by
  iac/ansible (roles/app_stack/tasks/wazuh.yml). Wazuh merges multiple
  <ossec_config> blocks, so upstream's file stays otherwise untouched.
-->
<ossec_config>
  <!-- Syslog intake from the three pfSense firewalls (docs/05). Only their
       management addresses are accepted. Each pfSense must set Status >
       System Logs > Settings > "Source Address" to its MGMT interface —
       otherwise branch logs arrive from the WireGuard tunnel IP (10.99.0.x)
       and are dropped here. -->
  <remote>
    <connection>syslog</connection>
    <port>514</port>
    <protocol>udp</protocol>
    <allowed-ips>10.10.10.1</allowed-ips> <!-- fw-hq -->
    <allowed-ips>10.20.10.1</allowed-ips> <!-- fw-north -->
    <allowed-ips>10.30.10.1</allowed-ips> <!-- fw-south -->
  </remote>

  <!-- Active response: block the source IP on the targeted host for 10 min
       after an SSH brute-force pattern (rules 5712/5763). Local to the
       attacked host, so a false positive can't cut off a whole site. -->
  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>5712,5763</rules_id>
    <timeout>600</timeout>
  </active-response>
</ossec_config>
