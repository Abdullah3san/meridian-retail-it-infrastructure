<svg viewBox="0 0 700 1010" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rack elevation of the HQ server room: a 24U rack containing a patch panel, core switch, pfSense firewall, cable management, two Proxmox hypervisor nodes, the Proxmox Backup Server, the TrueNAS NAS, ten reserved units for future growth, and a rack-mount UPS at the bottom.">
<title>HQ Server Room — Rack Elevation</title>
<desc>Physical rack layout for the HQ server room: 24 rack units from network gear at the top, through compute and backup/storage, down to reserved growth space and the UPS at the bottom for stability.</desc>
<style>text { font-family: "Segoe UI", Arial, sans-serif; }</style>

<defs>
  <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="0" y2="8" stroke="#d7dbe1" stroke-width="3"/>
  </pattern>
</defs>

<rect x="0" y="0" width="700" height="1010" fill="#f7f8fa"/>

<text x="350" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#1a2332">HQ Server Room — Rack Elevation</text>
<text x="350" y="58" text-anchor="middle" font-size="12.5" fill="#5b6472">24U rack · physical counterpart to the infrastructure map — device-to-VM mapping in docs/02, pricing in docs/08</text>

<!-- Outer rack frame -->
<rect x="164" y="86" width="372" height="776" fill="#e9ebee" stroke="#33404f" stroke-width="3" rx="4"/>

<!-- Rail tick marks (24 units, both sides) -->
<g stroke="#8a93a1" stroke-width="1">
  <!-- generated per-U below alongside each slot -->
</g>

<!-- ===== U slots, top (U24) to bottom (U1) ===== -->
<!-- U24: Patch Panel -->
<rect x="170" y="90" width="360" height="32" fill="#eef5ff" stroke="#2c5aa0" stroke-width="1.5"/>
<text x="350" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#1a2332">Patch Panel — 24-port</text>

<!-- U23: Core Switch -->
<rect x="170" y="122" width="360" height="32" fill="#eef5ff" stroke="#2c5aa0" stroke-width="1.5"/>
<text x="350" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#1a2332">sw-hq — Core L3 Switch</text>

<!-- U22: Firewall -->
<rect x="170" y="154" width="360" height="32" fill="#eef5ff" stroke="#2c5aa0" stroke-width="1.5"/>
<text x="350" y="174" text-anchor="middle" font-size="12" font-weight="700" fill="#1a2332">fw-hq — pfSense</text>

<!-- U21: Cable Management -->
<rect x="170" y="186" width="360" height="32" fill="#f2f3f5" stroke="#5b6472" stroke-width="1.5"/>
<text x="350" y="206" text-anchor="middle" font-size="12" font-weight="700" fill="#1a2332">Cable Management</text>

<!-- U20-19: Proxmox Node 1 -->
<rect x="170" y="218" width="360" height="64" fill="#e9f7f5" stroke="#1f8a7a" stroke-width="1.5"/>
<text x="350" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2332">pve-hq-01</text>
<text x="350" y="262" text-anchor="middle" font-size="11" fill="#3d6a63">Proxmox Node — 64GB RAM, 8c</text>

<!-- U18-17: Proxmox Node 2 -->
<rect x="170" y="282" width="360" height="64" fill="#e9f7f5" stroke="#1f8a7a" stroke-width="1.5"/>
<text x="350" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2332">pve-hq-02</text>
<text x="350" y="326" text-anchor="middle" font-size="11" fill="#3d6a63">Proxmox Node — 64GB RAM, 8c</text>

<!-- U16-15: pbs01 -->
<rect x="170" y="346" width="360" height="64" fill="#f5f0ff" stroke="#7a4fc9" stroke-width="1.5"/>
<text x="350" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2332">pbs01</text>
<text x="350" y="390" text-anchor="middle" font-size="11" fill="#5f3fa0">Proxmox Backup Server</text>

<!-- U14-13: nas01 -->
<rect x="170" y="410" width="360" height="64" fill="#f5f0ff" stroke="#7a4fc9" stroke-width="1.5"/>
<text x="350" y="436" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2332">nas01</text>
<text x="350" y="454" text-anchor="middle" font-size="11" fill="#5f3fa0">TrueNAS — bulk / secondary storage</text>

<!-- U12-3: Reserved (10U) -->
<rect x="170" y="474" width="360" height="320" fill="url(#hatch)" stroke="#c9ced6" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="350" y="628" text-anchor="middle" font-size="13" font-weight="700" fill="#8a93a1">Reserved — future growth</text>
<text x="350" y="646" text-anchor="middle" font-size="11" fill="#8a93a1">10U · next node, SIEM storage expansion, etc.</text>

<!-- U2-1: UPS -->
<rect x="170" y="794" width="360" height="64" fill="#f2f3f5" stroke="#5b6472" stroke-width="1.5"/>
<text x="350" y="820" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2332">UPS — Rack-mount</text>
<text x="350" y="838" text-anchor="middle" font-size="11" fill="#5b6472">Sized for ~15 min runtime on full rack + network gear</text>

<!-- U number rail (left) -->
<g font-size="9" fill="#8a93a1" text-anchor="end">
  <text x="162" y="110">U24</text><text x="162" y="142">U23</text><text x="162" y="174">U22</text><text x="162" y="206">U21</text>
  <text x="162" y="254">U20</text><text x="162" y="276">U19</text>
  <text x="162" y="318">U18</text><text x="162" y="340">U17</text>
  <text x="162" y="382">U16</text><text x="162" y="404">U15</text>
  <text x="162" y="446">U14</text><text x="162" y="468">U13</text>
  <text x="162" y="502">U12</text><text x="162" y="534">U11</text><text x="162" y="566">U10</text><text x="162" y="598">U9</text>
  <text x="162" y="630">U8</text><text x="162" y="662">U7</text><text x="162" y="694">U6</text><text x="162" y="726">U5</text>
  <text x="162" y="758">U4</text><text x="162" y="790">U3</text>
  <text x="162" y="810">U2</text><text x="162" y="852">U1</text>
</g>

<!-- Rail tick marks, both inner edges, every 32px -->
<g stroke="#33404f" stroke-width="1">
  <line x1="170" y1="90" x2="178" y2="90"/><line x1="522" y1="90" x2="530" y2="90"/>
  <line x1="170" y1="122" x2="178" y2="122"/><line x1="522" y1="122" x2="530" y2="122"/>
  <line x1="170" y1="154" x2="178" y2="154"/><line x1="522" y1="154" x2="530" y2="154"/>
  <line x1="170" y1="186" x2="178" y2="186"/><line x1="522" y1="186" x2="530" y2="186"/>
  <line x1="170" y1="218" x2="178" y2="218"/><line x1="522" y1="218" x2="530" y2="218"/>
  <line x1="170" y1="282" x2="178" y2="282"/><line x1="522" y1="282" x2="530" y2="282"/>
  <line x1="170" y1="346" x2="178" y2="346"/><line x1="522" y1="346" x2="530" y2="346"/>
  <line x1="170" y1="410" x2="178" y2="410"/><line x1="522" y1="410" x2="530" y2="410"/>
  <line x1="170" y1="474" x2="178" y2="474"/><line x1="522" y1="474" x2="530" y2="474"/>
  <line x1="170" y1="794" x2="178" y2="794"/><line x1="522" y1="794" x2="530" y2="794"/>
  <line x1="170" y1="858" x2="178" y2="858"/><line x1="522" y1="858" x2="530" y2="858"/>
</g>

<!-- ===== Legend ===== -->
<rect x="70" y="900" width="560" height="86" rx="10" fill="#ffffff" stroke="#d0d5dc" stroke-width="1"/>

<rect x="95" y="918" width="16" height="16" rx="3" fill="#eef5ff" stroke="#2c5aa0" stroke-width="2"/>
<text x="118" y="930" font-size="11.5" fill="#1a2332">Network &amp; edge</text>

<rect x="240" y="918" width="16" height="16" rx="3" fill="#e9f7f5" stroke="#1f8a7a" stroke-width="2"/>
<text x="263" y="930" font-size="11.5" fill="#1a2332">Compute (Proxmox)</text>

<rect x="405" y="918" width="16" height="16" rx="3" fill="#f5f0ff" stroke="#7a4fc9" stroke-width="2"/>
<text x="428" y="930" font-size="11.5" fill="#1a2332">Backup &amp; storage</text>

<rect x="95" y="946" width="16" height="16" rx="3" fill="#f2f3f5" stroke="#5b6472" stroke-width="2"/>
<text x="118" y="958" font-size="11.5" fill="#1a2332">Power &amp; passive</text>

<rect x="240" y="946" width="16" height="16" rx="3" fill="url(#hatch)" stroke="#c9ced6" stroke-width="2" stroke-dasharray="4 3"/>
<text x="263" y="958" font-size="11.5" fill="#1a2332">Reserved / empty</text>

<text x="605" y="958" text-anchor="end" font-size="10" fill="#8a93a1">docs/02 · docs/08 · fictional company</text>
</svg>
