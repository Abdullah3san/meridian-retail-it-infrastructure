<svg viewBox="0 0 1600 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Infrastructure map of Meridian Retail Group: HQ with a Proxmox server cluster and firewall connecting over WireGuard VPN to Branch North and Branch South, each with a firewall, switch, POS terminals, staff PCs, WiFi, and CCTV, all reaching the internet through per-site ISP links.">
<title>Meridian Retail Group — Infrastructure Map</title>
<desc>A single-page network map showing all three sites (HQ, Branch North, Branch South), their firewalls, switches, the HQ Proxmox server cluster and backup boxes, edge devices per site, VLAN trust coloring, and the WireGuard site-to-site VPN mesh connecting branches to HQ.</desc>
<style>
  text { font-family: "Segoe UI", Arial, sans-serif; }
</style>

<rect x="0" y="0" width="1600" height="1080" fill="#f7f8fa"/>

