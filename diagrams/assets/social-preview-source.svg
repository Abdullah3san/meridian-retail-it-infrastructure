<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Meridian Retail Group — Complete SMB IT Infrastructure. Portfolio reference design built on pfSense, WireGuard, Proxmox, ERPNext, Zabbix, and Wazuh.">
<title>Meridian Retail Group — Social Preview Card</title>
<style>text { font-family: "Segoe UI", Arial, sans-serif; }</style>

<rect x="0" y="0" width="1280" height="640" fill="#0d1520"/>

<!-- subtle grid texture, restrained -->
<g stroke="#16212f" stroke-width="1">
  <line x1="0" y1="160" x2="1280" y2="160"/>
  <line x1="0" y1="480" x2="1280" y2="480"/>
</g>

<!-- Left: title block -->
<text x="70" y="255" font-size="30" font-weight="700" fill="#5a7ba8" letter-spacing="2">SMB IT INFRASTRUCTURE — PORTFOLIO REFERENCE</text>
<text x="68" y="330" font-size="58" font-weight="800" fill="#f2f5f9">Meridian Retail Group</text>
<text x="70" y="375" font-size="22" fill="#9fb3c8">Network · Servers · Security · Software — 3 sites, one design</text>

<!-- tag pills -->
<g font-size="15" font-weight="600">
  <rect x="70" y="410" width="88" height="34" rx="17" fill="#132235" stroke="#2c5aa0" stroke-width="1.5"/>
  <text x="114" y="432" text-anchor="middle" fill="#bcd2ec">pfSense</text>

  <rect x="168" y="410" width="112" height="34" rx="17" fill="#132235" stroke="#7a4fc9" stroke-width="1.5"/>
  <text x="224" y="432" text-anchor="middle" fill="#d3c2f4">WireGuard</text>

  <rect x="290" y="410" width="98" height="34" rx="17" fill="#132235" stroke="#1f8a7a" stroke-width="1.5"/>
  <text x="339" y="432" text-anchor="middle" fill="#a9e0d5">Proxmox</text>

  <rect x="398" y="410" width="98" height="34" rx="17" fill="#132235" stroke="#2c5aa0" stroke-width="1.5"/>
  <text x="447" y="432" text-anchor="middle" fill="#bcd2ec">ERPNext</text>

  <rect x="506" y="410" width="150" height="34" rx="17" fill="#132235" stroke="#b9950a" stroke-width="1.5"/>
  <text x="581" y="432" text-anchor="middle" fill="#f0dda0">Zabbix + Wazuh</text>
</g>

<text x="70" y="500" font-size="16" fill="#5a7ba8">3 sites · 14 servers · open-source first · MIT licensed</text>
<text x="70" y="570" font-size="17" font-weight="600" fill="#7d93ac">github.com/Abdullah3san/meridian-retail-it-infrastructure</text>

<!-- Right: mini topology glyph -->
<ellipse cx="1030" cy="175" rx="72" ry="30" fill="#101c2c" stroke="#3b6fb6" stroke-width="2" stroke-dasharray="5 4"/>
<text x="1030" y="181" text-anchor="middle" font-size="13" font-weight="700" fill="#7fa8d9">INTERNET</text>

<line x1="1000" y1="200" x2="930" y2="300" stroke="#3b6fb6" stroke-width="2"/>
<line x1="1055" y1="200" x2="1120" y2="270" stroke="#3b6fb6" stroke-width="2"/>

<line x1="930" y1="345" x2="1120" y2="285" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="7 5"/>
<line x1="930" y1="345" x2="1120" y2="415" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="7 5"/>

<circle cx="930" cy="345" r="50" fill="#122036" stroke="#3b6fb6" stroke-width="3"/>
<text x="930" y="352" text-anchor="middle" font-size="20" font-weight="800" fill="#dce8f7">HQ</text>

<circle cx="1120" cy="270" r="36" fill="#0f2a25" stroke="#1f8a7a" stroke-width="2.5"/>
<text x="1120" y="277" text-anchor="middle" font-size="15" font-weight="700" fill="#bfe9df">N</text>

<circle cx="1120" cy="420" r="36" fill="#0f2a25" stroke="#1f8a7a" stroke-width="2.5"/>
<text x="1120" y="427" text-anchor="middle" font-size="15" font-weight="700" fill="#bfe9df">S</text>

</svg>
