---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Resolve own FQDN locally (Kerberos and Mailcow both need it)
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ inventory_hostname }}.{{ ad_domain }} {{ inventory_hostname }}"

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Apply pending updates
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: safe

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ baseline_packages }}"
    state: present

# --- Time: Kerberos fails outright beyond 5 min of skew ---------------------

- name: Configure chrony (DCs sync upstream, everyone else syncs to the DCs)
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    mode: "0644"
  notify: Restart chrony

# --- Patching (docs/02 — Patch management) ----------------------------------

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Never auto-reboot — mon01 alerts on pending reboots instead (docs/02)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52meridian-unattended
    mode: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";

# --- SSH hardening (docs/05 — Linux VM template baseline) -------------------

- name: Harden sshd
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-meridian.conf
    mode: "0644"
    content: |
      # Managed by Ansible (iac/ansible/roles/baseline)
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      X11Forwarding no
      MaxAuthTries 3
      LoginGraceTime 30
  notify: Reload sshd

- name: Enable guest agent
  ansible.builtin.service:
    name: qemu-guest-agent
    state: started
    enabled: true

# --- Optional data disk ------------------------------------------------------

- name: Prepare the data disk
  when: data_disk_device is defined
  block:
    - name: Create filesystem on data disk (no-op if one exists)
      community.general.filesystem:
        dev: "{{ data_disk_device }}"
        fstype: ext4

    - name: Mount data disk
      ansible.posix.mount:
        path: "{{ data_mount }}"
        src: "{{ data_disk_device }}"
        fstype: ext4
        opts: defaults,noatime
        state: mounted
